# ---------------------------------------------------------------------------
# django-forge — local stack
# ---------------------------------------------------------------------------
# Compose describes the whole stack in one file so that a single command starts
# everything, wired correctly, identically on every machine. The alternative is
# a `docker run` incantation that lives in one person's shell history.
#
# PROFILES. This file describes two stacks, not one:
#
#     docker compose up                          the development stack
#     docker compose --profile prod up app-prod  the production-like stack
#
# The `app` service carries no `profiles:` key, so it is always enabled and a
# bare `up` starts it — development is the common case and should need no flag.
# `app-prod` is opt-in. Name it explicitly, as above: `--profile prod up` on its
# own would ALSO start the always-enabled `app`, and the two would fight over a
# port. `make up` and `make up-prod` wrap both forms correctly.
#
# The point of keeping both in one file is that a production-only problem can be
# reproduced locally, against the same image, without inventing a second file
# that drifts out of step with this one.
#
# There is no `version:` key. It has been obsolete since Compose v2 and now only
# produces a warning.

# ---------------------------------------------------------------------------
# Shared service definition
# ---------------------------------------------------------------------------
# An `x-` key is ignored by Compose; the anchor (&app-base) lets both services
# merge it in with `<<: *app-base`. Defining the common half once is what stops
# the two profiles from quietly drifting apart — the failure mode being a
# production-like profile that no longer resembles production.
x-app-base: &app-base
  build:
    context: .
    # The named runtime stage in the Dockerfile. Without `target`, Compose would
    # build the last stage, which happens to be the same one today — being
    # explicit keeps that true when stages are added.
    target: runtime

  # Configuration comes from the environment, never from this file: it is
  # committed, so a secret written here is a published secret.
  #
  # `required: false` is what lets a clean checkout run `docker compose up` with
  # no preparation at all. `.env` is git-ignored and personal; `.env.example`
  # arrives with M3-03 and becomes the documented contract. Listing the file
  # rather than each variable means M3-03's variables reach the container
  # without this file needing another edit.
  env_file:
    - path: .env
      required: false

  # Prevents a process inside the container from gaining privileges through
  # setuid binaries. The companion to the non-root user from M2-03.
  security_opt:
    - no-new-privileges:true

  restart: unless-stopped

services:
  # -------------------------------------------------------------------------
  # app — the development stack (no `profiles:`, so this is what `up` starts)
  # -------------------------------------------------------------------------
  app:
    <<: *app-base

    build:
      context: .
      target: runtime
      args:
        # On Linux a bind mount keeps the host's numeric owner, so a container
        # user with a different UID cannot write the files it just mounted. The
        # Dockerfile takes these as build arguments for exactly this reason.
        # If `id -u` is not 1000 on your machine, export APP_UID/APP_GID (or put
        # them in .env) before building, or the M2-07 source mount will be
        # read-only from inside the container.
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}

    environment:
      # Deliberately minimal. Django's real variable set is defined by M3-02
      # (layered settings) and documented by M3-03; guessing names here now
      # would only create a second, wrong source of truth. Everything else
      # arrives through env_file above.
      DJANGO_DEBUG: "${DJANGO_DEBUG:-1}"
      # Pinned, NOT overridable. A shared .env would otherwise set the layer
      # for both services at once: a DJANGO_SETTINGS_MODULE meant for local
      # work silently made the production-like profile run DEVELOPMENT
      # settings, so it proved nothing. Each service owns its own layer.
      DJANGO_SETTINGS_MODULE: "config.settings.development"

      # The entrypoint (M2-05) waits for this to accept queries before starting
      # the application. Django itself does NOT read it yet — M4-02 wires
      # settings to it; until then the app still uses SQLite.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-forge}:${POSTGRES_PASSWORD:-forge}@db:5432/${POSTGRES_DB:-forge}"

    ports:
      # host:container. Override the host side with APP_PORT when 8000 is taken.
      - "${APP_PORT:-8000}:8000"

    # --- hot-reload source mount (development only) ---------------------------
    # The whole project is mounted over /app, so an edit on the host is visible
    # inside the container immediately and no rebuild is needed.
    #
    # This is safe ONLY because the virtualenv lives at /opt/venv, outside the
    # mounted path (see UV_PROJECT_ENVIRONMENT in the Dockerfile). If the venv
    # were still at /app/.venv this mount would hide it and every import would
    # fail with "module not found". Do not move it back.
    #
    # A rebuild is still required when dependencies change: uv.lock is installed
    # into the image at build time, not read from the mount.
    volumes:
      - .:/app


    # Wait for the database to be READY, not merely started.
    #
    # A bare `depends_on` waits only for the container to start. Postgres
    # accepts TCP connections well before it will answer a query, so the app
    # would connect too early and fail on its first statement — a race that
    # shows up on slow machines and in CI, and not on the developer's laptop.
    # `condition: service_healthy` waits for the db health check below.
    depends_on:
      db:
        condition: service_healthy

    # --- health check -------------------------------------------------------
    # Inherited from the image (see HEALTHCHECK in the Dockerfile), so every
    # launch path reports health identically and `docker compose ps` shows a
    # STATUS of "(healthy)". Override here only if dev and prod ever need
    # genuinely different probes.
    #
    # --- development server --------------------------------------------------
    # uvicorn serves config/asgi.py, so development uses the SAME interface as
    # production. Django's runserver is WSGI-only, which would have left the
    # ASGI entrypoint untested until the first async endpoint.
    #
    # --reload restarts on a source change; combined with the bind mount from
    # M2-07, an edit on the host restarts the server — no rebuild.
    #
    # 0.0.0.0 is required: binding to 127.0.0.1 would only accept connections
    # from inside the container, so the published port would appear dead.
    #
    # TODO(M6-02): --reload is a development feature and must never ship;
    # app-prod runs uvicorn without it, and M6-02 puts Gunicorn in front.
    command:
      - uvicorn
      - config.asgi:application
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      # Reload on source changes, using watchfiles across the bind mount from
      # M2-07. /app holds only project files — the virtualenv lives at
      # /opt/venv — so the watcher has little to scan.
      - --reload
      - --reload-dir
      - /app

  # -------------------------------------------------------------------------
  # db — PostgreSQL
  # -------------------------------------------------------------------------
  # Develop against the same engine production runs. SQLite differs in
  # transaction behaviour, type handling and constraint enforcement, so a class
  # of bugs would appear only after deploy.
  db:
    # PINNED TO A MINOR VERSION, deliberately. Tracking a major tag such as
    # `postgres:17` means an unexpected major upgrade can leave the existing
    # data directory unreadable: the container starts, refuses to read its own
    # data, and the local database is effectively gone.
    #
    # Debian, not Alpine. Alpine saves ~150 MB but uses musl, whose collation
    # differs from glibc — text ordering and some index behaviour would then not
    # match managed PostgreSQL services, reintroducing the local-vs-production
    # divergence this service exists to remove.
    #
    # Keep this in step with whatever production actually runs.
    image: postgres:17.6

    environment:
      # Throwaway development defaults so a clean checkout runs with no setup.
      # They protect nothing and are not secrets; override them in .env.
      POSTGRES_USER: "${POSTGRES_USER:-forge}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-forge}"
      POSTGRES_DB: "${POSTGRES_DB:-forge}"

    volumes:
      # A NAMED volume, so data outlives the container.
      #   docker compose down      keeps it
      #   docker compose down -v   DESTROYS it, unrecoverably
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      # pg_isready ships with the image. `-U` matters: without it the check
      # uses a default user that may not exist and reports a perfectly healthy
      # database as failing. The doubled $$ is Compose escaping — it passes a
      # literal $ through to the shell instead of substituting at parse time.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      # initdb runs on first boot and is slow; too short a start period reports
      # a healthy database as failing and restarts it in a loop.
      start_period: 30s
      retries: 5

    restart: unless-stopped

    # NOT published to the host, deliberately.
    #
    # The application reaches the database over the Compose network, and
    # `make db-shell` runs psql inside the container, so nothing here needs a
    # host port. Publishing 5432 by default collides with any locally-installed
    # PostgreSQL, and the whole stack then refuses to start with "address
    # already in use" — a poor first experience for a template. (This is not
    # hypothetical: it happened on the machine this was built on.)
    #
    # To reach it from a GUI client, add a personal override — the file is
    # already git-ignored, so it stays yours:
    #
    #     # docker-compose.override.yml
    #     services:
    #       db:
    #         ports: ["5433:5432"]

  # -------------------------------------------------------------------------
  # app-prod — the production-like stack (opt-in)
  # -------------------------------------------------------------------------
  # Same image, run the way a deployment would run it: no source mount, no
  # debug, no build arguments tailored to one developer's machine.
  app-prod:
    <<: *app-base

    # No `volumes:` here, deliberately. This service runs the image exactly as
    # built — that is what makes it a faithful stand-in for a deployment, and
    # what lets a production-only problem be reproduced locally. Mounting source
    # here would defeat the purpose of having two profiles at all.

    profiles:
      - prod

    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SETTINGS_MODULE: "config.settings.production"   # pinned; see app

      # Passed through, NOT defaulted: the production layer requires them
      # (M3-03) and refuses to start without them. Compose interpolates this
      # file globally, so a `:?` guard here would break every dev command
      # too — the check lives in the Makefile's up-prod target instead.
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-}"

    ports:
      # A different host port on purpose, so starting this stack while the
      # development one is up fails on neither port nor patience.
      - "${APP_PROD_PORT:-8001}:8000"

    # Give the application time to finish in-flight requests before it is
    # killed. M6-05 makes the server itself honour SIGTERM; this is the other
    # half of that, and 30s matches the default gunicorn graceful timeout.
    stop_grace_period: 30s

    # --- ASGI server (no reload) ---------------------------------------------
    # The same interface as development, served the way a deployment would:
    # no --reload, no source mount.
    #
    # TODO(M6-02): put Gunicorn in front, managing Uvicorn workers, with
    # worker count and timeouts from the environment. A single uvicorn process
    # has no process supervision and no graceful-restart story — fine for
    # reproducing a production-only problem locally, not for deployment.
    command:
      - uvicorn
      - config.asgi:application
      - --host
      - 0.0.0.0
      - --port
      - "8000"

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  # PostgreSQL's data directory. Named, so it survives container replacement.
  postgres_data:
#
# When it does, note that `docker compose down` keeps volumes and
# `docker compose down -v` destroys them. The second is unrecoverable.
